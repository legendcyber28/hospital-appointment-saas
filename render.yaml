services:
  - type: web
    name: swasthbook
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma db push && npx tsx prisma/seed.ts && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: swasthbook-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: WHATSAPP_MODE
        value: demo
databases:
  - name: swasthbook-db
    plan: free
